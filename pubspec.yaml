name: ar_furniture_beta
description: "A Flutter project for testing and UI improvements."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  file_picker: ^8.1.7
  go_router: ^16.0.0
  model_viewer_plus: ^1.7.0
  provider: ^6.1.5
  google_fonts: ^6.3.1
  flutter_svg: ^2.2.0
  screenshot: ^3.0.0
  path_provider: ^2.1.0
  share_plus: ^10.0.0
  shared_preferences: ^2.2.0
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/furniture/
    - assets/furniture_models/
